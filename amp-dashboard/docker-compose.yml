services:
  eureka:
    image: ${REPO}/eureka:${DASHBOARD_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 45s
    networks:
      - backend

  gateway:
    image: ${REPO}/gateway:${DASHBOARD_TAG}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/tcdi"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
      JAVA_OPTS: "-Xmx200m -Xms200m"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    networks:
      - backend

  superset-proxy:
    image: ${REPO}/superset-proxy:${DASHBOARD_TAG}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/amp"
      VIZ_SUPERSET_URL: "http://superset:8088/api/v1"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
      SPRING_DATA_REDIS_HOST: "cache"
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:-admin}"
      JAVA_OPTS: "-Xmx200m -Xms200m"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
      cache:
        condition: service_started
    networks:
      - backend

  cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - cache:/data
    networks:
      - backend

  superset:
    image: apache/superset:latest
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-change-me}"
      ENABLE_PROXY_FIX: "true"
      SUPERSET_WEBSERVER_PORT: "8088"
      SUPERSET_WEBSERVER_ADDRESS: "0.0.0.0"
      STATIC_ASSETS_PREFIX: "/superset"
      APPLICATION_ROOT: "/superset"
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - backend

  stats:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: stats
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "stats"
      SPRING_LIQUIBASE_ENABLED: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - backend

  starter:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: starter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/info"]
      interval: 30s
      timeout: 20s
      retries: 10
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_JPA_HIBERNATE_DDL-AUTO: "none"
      SERVER_PORT: "8083"
      SPRING_APPLICATION_NAME: "starter"
      SPRING_LIQUIBASE_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - backend

  wordpress:
    image: ${REPO}/wordpress:${DASHBOARD_TAG}
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DASHBOARD_MYSQL_WP_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      PATCH_FILES: "true"
      JWT_AUTH_SECRET_KEY: "${JWT_AUTH_SECRET_KEY:-change-me}"
    depends_on:
      mysql:
        condition: service_started
    volumes:
      - wordpress:/var/www/html
    networks:
      - backend

  ui-customizer:
    image: ${REPO}/ui-customizer:${DASHBOARD_TAG}
    restart: unless-stopped
    environment:
      PROJECT_SITE: ${PROJECT_SITE:-}

  wp-customizer:
    image: ${REPO}/wp-customizer:${DASHBOARD_TAG}
    restart: unless-stopped

  nginx:
    image: ${REPO}/nginx:${DASHBOARD_TAG}
    restart: unless-stopped
    environment:
      VITE_REACT_APP_TITLE: "AMP Dashboard"
      VITE_REACT_APP_DEFAULT_LOCALE: "en"
      VITE_REACT_APP_USE_HASH_LINKS: "false"
      VITE_REACT_APP_WP_HOSTS: "localhost"
      VITE_REACT_APP_WP_API: "/wp/wp-json"
      REACT_APP_WP_SEARCH_END_POINT: "/dg/v1/search"
    depends_on:
      gateway:
        condition: service_started
      eureka:
        condition: service_started
      wordpress:
        condition: service_started
      ui-customizer:
        condition: service_started
    ports:
      - "8081:80"
    volumes:
      - wordpress:/var/www/html:ro
    networks:
      - backend
      - frontend
      - edge

  mysql:
    image: mariadb:10.7-focal
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DASHBOARD_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${DASHBOARD_MYSQL_WP_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - backend

  postgres:
    image: mdillon/postgis
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DASHBOARD_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: viz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viz"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 50s
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend

  amp-funding:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: amp-funding
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "amp-funding"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/amp_funding"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - amp_funding_data:/opt/viz/amp_funding
    networks:
      - backend

  amp-indicator-dashboard:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: amp-indicator-dashboard
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "amp-indicator-dashboard"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/amp_indicator_dashboard"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - amp_indicator_dashboard_data:/opt/viz/amp_indicator_dashboard
    networks:
      - backend

  amp-ndc-financing:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: amp-ndc-financing
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "amp-ndc-financing"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/amp_ndc_financing"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - amp_ndc_financing_data:/opt/viz/amp_ndc_financing
    networks:
      - backend

  amp-ndc-scenario:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: amp-ndc-scenario
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "amp-ndc-scenario"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/amp_ndc_scenario"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - amp_ndc_scenario_data:/opt/viz/amp_ndc_scenario
    networks:
      - backend

  amp-ndc-emissions:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: amp-ndc-emissions
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "amp-ndc-emissions"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/amp_ndc_emissions"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - amp_ndc_emissions_data:/opt/viz/amp_ndc_emissions
    networks:
      - backend

  map-service:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: MapService
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "map-service"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/map_service"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - map_service_data:/opt/viz/map_service
    networks:
      - backend

  amp-indicator-progress:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: amp-indicator-progress
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "amp-indicator-progress"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/amp_indicator_progress"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - amp_indicator_progress_data:/opt/viz/amp_indicator_progress
    networks:
      - backend

  amp-wocat:
    image: ${REPO}/api:${DASHBOARD_TAG}
    restart: unless-stopped
    command: amp-wocat
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/viz"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DASHBOARD_DB_PASSWORD}"
      SPRING_APPLICATION_NAME: "amp-wocat"
      VIZ_IMPORT_DIRECTORY: "/opt/viz/amp_wocat"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
      WOCAT_BASE_URL: "https://qcat.wocat.net"
      WOCAT_VERSION_URL_EN: "/en/api/v2/questionnaires/"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      starter:
        condition: service_started
    volumes:
      - amp_wocat_data:/opt/viz/amp_wocat
    networks:
      - backend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  edge:
    driver: bridge

volumes:
  wordpress:
  mysql:
  postgres:
  postgres_test:
  cache:
  amp_funding_data:
  amp_indicator_dashboard_data:
  amp_ndc_financing_data:
  amp_ndc_scenario_data:
  amp_ndc_emissions_data:
  map_service_data:
  amp_indicator_progress_data:
  amp_wocat_data:
