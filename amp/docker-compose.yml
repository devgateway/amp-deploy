services:
  amp:
    image: ${AMP_IMAGE}:${AMP_TAG}
    container_name: amp
    restart: unless-stopped
    environment:
      AMP_DB_NAME: ${AMP_DB_NAME}
      AMP_DB_USER: ${AMP_DB_USER}
      AMP_DB_PASSWORD: ${AMP_DB_PASSWORD}
      AMP_DB_HOST: ${AMP_DB_HOST:-amp-db}
      AMP_DB_PORT: ${AMP_DB_PORT:-5432}
      AMP_JVM_HEAP: ${AMP_JVM_HEAP:-4g}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      amp-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    labels:
      traefik.enable: "true"
      traefik.http.routers.amp.rule: "Host(`${AMP_DOMAIN}`)"
      traefik.http.routers.amp.entrypoints: "web"
      traefik.http.services.amp.loadbalancer.server.port: "8080"
    networks:
      - amp_internal
      - edge

  amp-db:
    image: ${AMP_DB_IMAGE:-postgis/postgis:14-3.4}
    container_name: amp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AMP_DB_NAME}
      POSTGRES_USER: ${AMP_DB_USER}
      POSTGRES_PASSWORD: ${AMP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AMP_DB_USER} -d ${AMP_DB_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    volumes:
      - amp_db_data:/var/lib/postgresql/data
    networks:
      amp_internal:
        aliases:
          - db

networks:
  amp_internal:
    driver: bridge
  edge:
    driver: bridge

volumes:
  amp_db_data:
